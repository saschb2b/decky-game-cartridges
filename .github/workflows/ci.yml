name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pip install -r requirements-dev.txt

      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Lint Python
        run: ruff check .
      - name: Lint shell scripts
        run: shellcheck -S warning cartridge/lib.sh cartridge/agent/*.sh tools/*.sh examples/*/games/*/launch.sh
      - name: Test
        run: pytest

      - name: Package
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: game-cartridges
          path: out/game-cartridges.zip
          if-no-files-found: error
